name: Tests

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

jobs:
  hello-world:
    name: Hello World Demo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: demos/hello-world

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: ./vendor/bin/phpunit

  order-processing:
    name: Order Processing Demo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: demos/order-processing

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: ./vendor/bin/phpunit
