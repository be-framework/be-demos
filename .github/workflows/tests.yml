name: Tests

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

jobs:
  tests:
    name: ${{ matrix.demo }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        demo:
          - hello-world
          - contact-form
          - user-registration
          - blog-publishing
          - order-processing
          - medical-triage
          - loan-application
          - insurance-claim
    defaults:
      run:
        working-directory: demos/${{ matrix.demo }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: ./vendor/bin/phpunit
