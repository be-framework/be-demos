name: GitHub Pages

on:
  push:
    branches: [1.x]
    paths:
      - 'demos/*/docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app-state-diagram
        run: npm install -g @anthropic/app-state-diagram

      - name: Generate ALPS HTML
        run: |
          for alps_file in demos/*/docs/alps.xml; do
            if [ -f "$alps_file" ]; then
              dir=$(dirname "$alps_file")
              asd "$alps_file" -o "$dir/alps.html"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r demos/*/docs/* _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
